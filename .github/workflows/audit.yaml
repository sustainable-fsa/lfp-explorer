# The web map's quality gate: markup, accessibility, behaviour, Lighthouse.
#
# This repo has no data pipeline: every payload is built and archived by a
# sibling repo (fsa-normal-grazing-period, nclimgrid-normal-grazing-period, …)
# whose own workflow commits a web-optimized JSON to its root. This workflow
# reads nothing but the checkout — plus those payloads, staged below from
# tools/payloads.txt — and must be cheap enough to run on every pull request.
#
# WHAT THE NETWORK IS FOR. The app loads the house style kit by full pinned URL
# (https://sustainable-fsa.com/style/v0.4.1/…), fetches its county geometry at
# runtime as PMTiles vector tiles from https://data.sustainable-fsa.com — a
# second origin, because it serves the HTTP range requests GitHub Pages does not
# — and fetches each data payload by RELATIVE path
# (../<repo>/<file>), which in production is that archive repo's same-origin
# GitHub Pages copy. All are fetched LIVE here — the payloads are curled into
# the sibling directories the relative paths expect, since the harnesses serve
# the parent of this checkout. That is deliberate: those origins are part of
# the app's contract, and a run that stubbed them would gate a different app.
# It also means a sustainable-fsa.com outage fails this workflow, which is the
# correct signal.
#
# ONLY THE FIRST PAYLOAD IS ON THE BOOT PATH. Everything else is fetched when a
# visitor asks for it, which is what keeps the Lighthouse LCP where it was;
# tools/verify.mjs asserts that directly from the page's own resource timeline,
# because Lighthouse cannot express it.
#
# WHAT "THE MAP RENDERED" MEANS HERE. The render evidence is the app's own
# data-loaded hook — `document.documentElement.dataset.ngpReady === '1'`, set
# after the payload is joined and the first choropleth paint has run. It is NOT
# evidence of painted tiles, and nothing below should be read that way. The
# swiftshader flags exist so MapLibre can get a WebGL context at all on a
# GPU-less runner; without them the app degrades to its error note and the
# behavioural half of this workflow tests nothing.
#
# ── WHY FOUR JOBS AND NOT ONE ───────────────────────────────────────────────
# This was one serial `audit` job until 2026-08-27, and it took about 25
# minutes. Nothing in it was slow by accident; there was simply no reason for
# any of it to wait on the rest. Measured, per step, on the last green main run
# of the serial shape (33077870450):
#
#   checkout + setup-node + npm ci + playwright chromium   ~37 s
#   html-validate                                            1 s
#   stage payloads                                           3 s
#   check-boundaries                                         1 s
#   a11y audit (2 themes × 2 viewports × 11 states)        780 s
#   verify.mjs                                             617 s
#   LHCI                                                    59 s
#
# Two steps are 93% of the run and they share nothing: one drives axe over
# static pictures of the app, the other drives the app. So they are separate
# jobs now, the axe pass is fanned out over its own matrix — each leg one
# theme × one viewport, all eleven states — and the two cheap gates that need
# no browser at all stop queueing behind either. COVERAGE IS IDENTICAL: the
# same harnesses, the same assertions, the same themes, viewports and states.
# Only where they run changed. The new wall is verify.mjs's own ~10.3 minutes,
# and shortening THAT is a different piece of work from this one.
#
# THE SETUP IS REPEATED IN EVERY JOB, ON PURPOSE. npm ci is 6 s and the
# chromium download is 24 s, measured; a cross-job cache to save 30 s would
# add a cache key to keep honest, a restore-miss path to reason about, and a
# way for two jobs to disagree about what they installed. The payload staging
# is likewise repeated in all four — it is a loop over ONE manifest
# (tools/payloads.txt), which is the thing that must never fork, and every job
# below either serves the app or reads the payloads.
name: audit
run-name: Audit the lfp-explorer web map

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'help.md'
      - 'css/**'
      - 'js/**'
      - 'brand/**'
      - 'assets/*.json'
      - 'tools/**'
      - '.htmlvalidate.json'
      - '.lighthouserc.json'
      - '.github/workflows/audit.yaml'

permissions:
  contents: read

# Workflow-level, so a push that supersedes an in-flight run cancels ALL of its
# jobs — the four below are one gate with one verdict, and half a cancelled run
# is not a cheaper answer, it is a misleading one. Group per ref, as before.
concurrency:
  group: audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1 · The gates that need no browser ────────────────────────────────────
  # Markup validity and the county-authority contract. ~20 s all in, which is
  # why these two used to be invisible at the head of a 25-minute job and are
  # now the first thing a pull request hears back about.
  checks:
    name: markup + county authority
    runs-on: ubuntu-latest
    # A backstop against a hang, not a budget. The work is ~5 s of it; the rest
    # is network (npm, and check-boundaries' 21 live sidecar fetches).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/package-lock.json

      # tools/ is the only package.json in this repo that is tracked; the root
      # one is gitignored, per the kit's zero-dependency rule for consumers.
      - name: Install audit tooling
        run: npm ci --prefix tools

      # --prefix tools, NOT --yes: a bare `npx --yes html-validate` resolves
      # from the working directory's node_modules, which does not exist at the
      # repo root (the root package.json is gitignored), so it would fetch
      # whatever is newest on the registry and the gate would drift under the
      # repo without a commit. html-validate is pinned in
      # tools/package-lock.json for the same reason every other tool here is.
      - name: Validate markup
        run: npx --prefix tools html-validate index.html

      # The app fetches every payload by RELATIVE sibling path
      # (../<repo>/<file>), which every server below resolves against the
      # workspace root. Production has each one as that archive repo's Pages
      # copy; here they are curled — the published artifacts themselves, not a
      # rebuild — into their sibling slots. A full checkout of those repos
      # would drag whole data archives along for one file each.
      #
      # tools/payloads.txt is the single manifest, and the rule that keeps this
      # step honest is that a line lands in the SAME commit that makes the app
      # fetch it — so staging can never lag the app. `curl -f` fails the step
      # on any missing artifact, which is the correct signal: those origins are
      # part of the app's contract. The crosswalk is deliberately not here; it
      # is a committed repo asset, served by the checkout itself.
      #
      # THIS BLOCK IS REPEATED IN EVERY JOB BELOW. It is a mechanical loop over
      # the manifest; the manifest is the part that has to stay single.
      - name: Stage the data payloads at their sibling paths
        run: |
          root="$(dirname "$GITHUB_WORKSPACE")"
          while IFS= read -r path || [ -n "$path" ]; do
            case "$path" in ''|\#*) continue ;; esac
            echo "staging $path"
            mkdir -p "$root/$(dirname "$path")"
            curl -fsSL --retry 3 \
              "https://sustainable-fsa.com/$path" -o "$root/$path"
          done < tools/payloads.txt

      # The county-authority contract: does a program year resolve to the
      # tileset the DATA says it should? No browser — this is policy, and a map
      # drawn on the wrong boundary vintage looks perfect. Every county has a
      # colour, every shape is a real county, and the boundaries are simply from
      # the wrong year; there is no pixel to inspect. So the gate asks the only
      # authority that can answer, which is the published data: usdm-counties'
      # '.' sentinels make each year's county set observable, and it has to
      # equal the resolved tileset's set across all 27 years.
      #
      # Runs AFTER the staging step above, because it reads the payloads from
      # their sibling slots to check each dataset against the authority it
      # declares. It also fetches the 21 county index sidecars live from
      # https://data.sustainable-fsa.com, which is also where the app itself now
      # gets every polygon it draws. A Pages deploy of the KIT while this
      # workflow runs has been seen to produce one transient CORS failure on one
      # theme/viewport combo; if a run fails with "No
      # 'Access-Control-Allow-Origin' header" against a /style/ URL, check
      # whether something was deploying before investigating.
      - name: County authority contract
        run: node tools/check-boundaries.mjs

  # ── 2 · Behavioural verification ──────────────────────────────────────────
  # tools/verify.mjs, whole and unsharded. ~10.3 minutes, which makes this job
  # the workflow's wall; see the header for why that is the next thing to look
  # at rather than something this restructure tried to fix.
  verify:
    name: behavioural verification
    runs-on: ubuntu-latest
    # 30, not 45: the serial job's 45 covered axe AND verify AND Lighthouse.
    # This job is verify alone — 10.3 minutes measured on a runner, ~2.7 locally
    # — so 30 is the same generous multiple the old number was, against the same
    # failure it guards: a hang, not a slow run. It moves when a PR measures
    # that it has to, not when the app grows.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: Install audit tooling
        run: npm ci --prefix tools

      - name: Install Chromium
        run: npx --prefix tools playwright install --with-deps chromium

      # See `checks` above for why this is a curl loop over tools/payloads.txt.
      - name: Stage the data payloads at their sibling paths
        run: |
          root="$(dirname "$GITHUB_WORKSPACE")"
          while IFS= read -r path || [ -n "$path" ]; do
            case "$path" in ''|\#*) continue ;; esac
            echo "staging $path"
            mkdir -p "$root/$(dirname "$path")"
            curl -fsSL --retry 3 \
              "https://sustainable-fsa.com/$path" -o "$root/$path"
          done < tools/payloads.txt

      # The harness serves the WORKSPACE root — the parent of this checkout —
      # so the app sits at /lfp-explorer/ exactly as it deploys. On a runner the
      # checkout is at $GITHUB_WORKSPACE, whose basename is the repository name,
      # so the default (two levels up from tools/) is already right and no
      # argument is needed.
      - name: Behavioural verification
        run: node tools/verify.mjs

      # Screenshots of every state the verify run drove, kept whether it passed
      # or failed — on a failure they are the whole diagnosis.
      - name: Upload verify screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-out
          path: verify-out/
          if-no-files-found: warn
          retention-days: 14

  # ── 3 · Accessibility, one theme × viewport per leg ───────────────────────
  # The axe pass is 780 s of four independent combos that never touch each
  # other's page, so it fans out to ~195 s a leg. Each leg still walks the
  # WHOLE state list; the split is across the matrix, never across the states.
  a11y:
    name: a11y · ${{ matrix.theme }} · ${{ matrix.viewport }}
    runs-on: ubuntu-latest
    # One leg of what used to be a 780 s step, plus setup. 20 is a hang
    # backstop with room for a cold CDN on the 11 MB derived archive.
    timeout-minutes: 20
    strategy:
      # All four legs report. A contrast failure that only fires in
      # high-contrast · narrow and a name failure that only fires in
      # light · wide are two findings, and cancelling the siblings on the first
      # one would hide the second behind a re-run.
      fail-fast: false
      matrix:
        # THESE VALUES MUST MATCH tools/config.mjs's THEMES and
        # tools/a11y-audit.mjs's AUDIT_VIEWPORTS, and a mismatch FAILS LOUDLY
        # by design: A11Y_THEME / A11Y_VIEWPORT select from those lists, and a
        # value that selects nothing exits 1 naming the valid ones rather than
        # auditing zero combos and reporting a pass. So a rename upstream
        # breaks this file in the open — which is the only safe way for a
        # hand-enumerated matrix to track a harness's own list.
        include:
          - theme: light
            viewport: wide
          - theme: light
            viewport: narrow
          - theme: high-contrast
            viewport: wide
          - theme: high-contrast
            viewport: narrow
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: Install audit tooling
        run: npm ci --prefix tools

      - name: Install Chromium
        run: npx --prefix tools playwright install --with-deps chromium

      # See `checks` above for why this is a curl loop over tools/payloads.txt.
      - name: Stage the data payloads at their sibling paths
        run: |
          root="$(dirname "$GITHUB_WORKSPACE")"
          while IFS= read -r path || [ -n "$path" ]; do
            case "$path" in ''|\#*) continue ;; esac
            echo "staging $path"
            mkdir -p "$root/$(dirname "$path")"
            curl -fsSL --retry 3 \
              "https://sustainable-fsa.com/$path" -o "$root/$path"
          done < tools/payloads.txt

      # The harness serves the WORKSPACE root, as verify does, for the same
      # reason. The step name deliberately names the combo but not a state
      # count: the state list grows with the app, and a new interaction state
      # should never have to touch this file.
      - name: Accessibility audit (axe · all interaction states)
        env:
          A11Y_THEME: ${{ matrix.theme }}
          A11Y_VIEWPORT: ${{ matrix.viewport }}
        run: node tools/a11y-audit.mjs

  # ── 4 · Lighthouse ────────────────────────────────────────────────────────
  lighthouse:
    name: lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: Install audit tooling
        run: npm ci --prefix tools

      # NO `playwright install` HERE, and that is not an omission. LHCI launches
      # through chrome-launcher, which resolves a browser from CHROME_PATH or
      # from `google-chrome-stable` / `google-chrome` / `chromium-browser` on
      # PATH (chrome-launcher 0.13.4, dist/chrome-finder.js) and never looks in
      # playwright's ~/.cache/ms-playwright. The runner image's preinstalled
      # Chrome is what the serial job was really using too; the playwright
      # download it sat behind was 24 s of nothing. Its GL flags are in
      # .lighthouserc.json, not here — same swiftshader set, same reason.
      #
      # See `checks` above for why this is a curl loop over tools/payloads.txt.
      - name: Stage the data payloads at their sibling paths
        run: |
          root="$(dirname "$GITHUB_WORKSPACE")"
          while IFS= read -r path || [ -n "$path" ]; do
            case "$path" in ''|\#*) continue ;; esac
            echo "staging $path"
            mkdir -p "$root/$(dirname "$path")"
            curl -fsSL --retry 3 \
              "https://sustainable-fsa.com/$path" -o "$root/$path"
          done < tools/payloads.txt

      # Lighthouse needs a server it does not own — see .lighthouserc.json for
      # why staticDistDir cannot serve a subpath app. The server and the run
      # share ONE step: a process backgrounded in an earlier step is not
      # something to rely on surviving into a later one.
      #
      # $GITHUB_WORKSPACE is …/work/<repo>/<repo>, so its parent is the
      # workspace root and its basename is the repo directory — which is how
      # the hardcoded /lfp-explorer/ in .lighthouserc.json lines
      # up with what is being served.
      - name: Lighthouse
        run: |
          python3 -m http.server 8000 -d "$(dirname "$GITHUB_WORKSPACE")" \
            >/dev/null 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          up=0
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null \
                "http://localhost:8000/$(basename "$GITHUB_WORKSPACE")/"; then
              up=1; break
            fi
            sleep 1
          done
          if [ "$up" -ne 1 ]; then
            echo "::error::the static server never came up"
            exit 1
          fi
          npx --prefix tools lhci autorun --config=.lighthouserc.json

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: .lighthouseci/
          if-no-files-found: warn
          retention-days: 14
